name: e-invoice-provider

services:
  mongo:
    image: mongo
    container_name: mongo_db
    volumes:
      - ./docker/docker_data/mongodb_data:/data/db
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
