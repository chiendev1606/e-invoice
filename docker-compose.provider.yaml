name: e-invoice-provider

networks:
  e-invoice-nw:
    driver: bridge
    name: e-invoice-nw

services:
  mongo:
    image: mongo
    container_name: mongo_db
    volumes:
      - ./docker/docker_data/mongodb_data:/data/db
    restart: unless-stopped
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - e-invoice-nw
  postgres:
    image: postgres:18
    container_name: postgres_db
    volumes:
      # PG18+ stores data in a major-version subdir (/var/lib/postgresql/18/docker),
      # so the mount must sit at /var/lib/postgresql, not /var/lib/postgresql/data.
      - ./docker/docker_data/postgres_data:/var/lib/postgresql
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: e-invoice-app
    networks:
      - e-invoice-nw
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_ui
    restart: unless-stopped
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pgadmin.org
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      - postgres
    networks:
      - e-invoice-nw
    volumes:
      - ./docker/docker_data/pgadmin_data:/var/lib/pgadmin
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: keycloak_sso
    # start-dev serves plain HTTP and skips the strict hostname checks that "start"
    # enforces. Local development only; a real deployment uses "start" behind TLS.
    command: start-dev
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      # start-dev with no KC_DB keeps everything in the embedded H2 store under
      # this directory (h2/keycloakdb.mv.db), so realms, users and clients live in
      # the bind mount and are lost if it is deleted. This is also where realm files
      # dropped into data/import are read from when starting with --import-realm.
      - ./docker/docker_data/keycloak_data:/opt/keycloak/data
    environment:
      # Initial admin account, created once on the first boot against an empty database.
      # Renamed from KEYCLOAK_ADMIN/KEYCLOAK_ADMIN_PASSWORD in Keycloak 26.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    networks:
      - e-invoice-nw
